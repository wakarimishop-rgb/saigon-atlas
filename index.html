const catopts=val=>Object.entries(categories).map(([k,v])=>`<option value="${k}" ${k===val?'selected':''}>${v[1]} ${v[0]}</option>`).join('');const areaopts=val=>['未設定',...areas.map(a=>a[0])].map(a=>`<option ${a===val?'selected':''}>${esc(a)}</option>`).join('');
function edit(id){editing=id;const p=pins.find(x=>x.id===id);if(!p)return;const status=p.starter?'初期登録地点（座標は参考値）':'自分で登録したピン';open('ピンを編集',`<div class="quiet">${status}</div><div class="field"><label>名称</label><input id="fName" value="${esc(p.name)}" placeholder="例：内見物件 A"></div><div class="twocol"><div class="field"><label>カテゴリ</label><select id="fCat">${catopts(p.cat)}</select></div><div class="field"><label>旧区・エリア</label><select id="fArea">${areaopts(p.area)}</select></div></div><div class="field"><label>通りの名前（ベトナム語）</label><input id="fStreet" value="${esc(p.street)}" placeholder="例：Nguyễn Huệ"></div><div class="field"><label>ワンポイントメモ・家賃・周辺情報</label><textarea id="fNote" placeholder="道順、家賃、感想など">${esc(p.note)}</textarea></div><div class="field"><label>Google Maps / 物件URL（任意）</label><input id="fUrl" type="url" value="${esc(p.url||'')}" placeholder="https://..."></div><label class="switchrow">訪問済み・確認済み <input id="fVisited" type="checkbox" ${p.visited?'checked':''}></label><div class="status">位置：${p.lat.toFixed(5)}, ${p.lng.toFixed(5)}　<button id="movePin" class="sub" style="padding:5px 8px">地図で移動</button></div><div class="btnrow"><button id="deletePin" class="danger">削除</button><button id="cancelEdit" class="sub">キャンセル</button><button id="savePin" class="primary">保存</button></div>`);
$('savePin').onclick=()=>{p.name=$('fName').value.trim()||'無題のピン';p.cat=$('fCat').value;p.area=$('fArea').value;p.street=$('fStreet').value.trim();p.note=$('fNote').value.trim();p.url=$('fUrl').value.trim();p.visited=$('fVisited').checked;persist();render();close();toast('保存しました')};$('deletePin').onclick=()=>{if(confirm('このピンを削除しますか？')){pins=pins.filter(x=>x.id!==id);persist();render();close()}};$('cancelEdit').onclick=close;$('movePin').onclick=()=>{close();moveId=id;toast('地図の新しい位置を1回タップしてください')};}
let moveId=null;function create(lat,lng,name='',cat='other'){const p={id:'p'+Date.now()+Math.random().toString(36).slice(2,6),name:name||'新しいピン',lat,lng,cat,area:nearbyArea(lat,lng),street:'',note:'',url:'',visited:false,starter:false};pins.push(p);persist();render();edit(p.id)}map.on('click',e=>{if(moveId){const p=pins.find(x=>x.id===moveId);if(p){p.lat=e.latlng.lat;p.lng=e.latlng.lng;persist();render()}moveId=null;toast('ピンの位置を更新しました')}else if(addMode){addMode=false;$('addBtn').classList.remove('sel');create(e.latlng.lat,e.latlng.lng)}});let pressTimer=null,pressStart=null;const el=map.getContainer();el.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;pressStart={x:e.touches[0].clientX,y:e.touches[0].clientY};pressTimer=setTimeout(()=>{const pt=map.containerPointToLatLng(L.point(pressStart.x-el.getBoundingClientRect().left,pressStart.y-el.getBoundingClientRect().top));create(pt.lat,pt.lng);pressTimer=null},720)},{passive:true});el.addEventListener('touchmove',e=>{if(pressStart&&Math.hypot(e.touches[0].clientX-pressStart.x,e.touches[0].clientY-pressStart.y)>12)clearTimeout(pressTimer)},{passive:true});['touchend','touchcancel'].forEach(ev=>el.addEventListener(ev,()=>clearTimeout(pressTimer)));
$('addBtn').onclick=()=>{close();addMode=!addMode;$('addBtn').classList.toggle('sel',addMode);toast(addMode?'追加したい場所を地図で1回タップ':'ピン追加を解除しました')};$('allBtn').onclick=()=>{close();map.setView([10.779,106.70],13)};$('districtToggle').onclick=()=>{showAreas=!showAreas;zones();$('districtToggle').classList.toggle('active',showAreas);toast(showAreas?(boundaryState==='ready'?'実際の行政境界を表示':'境界データの取得が必要です'):'エリアを非表示')};$('layerToggle').onclick=()=>{tiles[basemap].remove();basemap=1-basemap;tiles[basemap].addTo(map);tiles[basemap].bringToBack()};$('locate').onclick=()=>{map.locate({setView:true,maxZoom:16});map.once('locationfound',e=>{L.circleMarker(e.latlng,{radius:8,color:'#1768df',weight:3,fillOpacity:.5}).addTo(map)});map.once('locationerror',()=>toast('位置情報の権限・HTTPS接続をご確認ください'))};
$('filtersBtn').onclick=()=>{open('表示カテゴリ',`<p class="quiet">表示したい種類を選択。ピン自体は消えません。</p><div class="sections">${Object.entries(categories).map(([k,v])=>`<button class="chip ${shown.has(k)?'on':''}" data-cat="${k}">${v[1]} ${v[0]}</button>`).join('')}</div><div class="btnrow"><button id="showAll" class="primary">すべて表示</button><button id="hideAll" class="sub">すべて非表示</button></div><h3>旧区の位置へ移動</h3><div class="district-grid">${areas.map(a=>`<button class="district-btn" data-area="${esc(a[0])}"><span class="swatch" style="background:${a[4]}"></span>${esc(a[0])}</button>`).join('')}</div><p class="quiet">色分けは行政境界データから取得した実際のポリゴンです。表示できない場合は警告が出ます。旧区名称は学習用です。</p>`);document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{const c=b.dataset.cat;shown.has(c)?shown.delete(c):shown.add(c);b.classList.toggle('on',shown.has(c));render()});$('showAll').onclick=()=>{shown=new Set(Object.keys(categories));render();close()};$('hideAll').onclick=()=>{shown.clear();render();close()};document.querySelectorAll('[data-area]').forEach(b=>b.onclick=()=>{const a=areas.find(x=>x[0]===b.dataset.area);map.flyTo([a[1],a[2]],14);close()})};
$('pinsBtn').onclick=()=>{const items=[...pins].sort((a,b)=>Number(b.visited)-Number(a.visited));open(`ピン一覧（${pins.length}）`,`<div class="quiet">場所をタップすると地図を移動し、メモを編集できます。</div><div class="field"><input id="pinFilter" placeholder="ピン名・通り・メモで絞り込む"></div><div id="pinList"></div>`);function fill(q=''){const a=items.filter(p=>(p.name+p.street+p.note+p.area).toLowerCase().includes(q.toLowerCase()));$('pinList').innerHTML=a.map(p=>`<div class="item"><span style="font-size:22px">${categories[p.cat]?.[1]||'📌'}</span><div class="text"><strong>${esc(p.name)} ${p.visited?'✓':''}</strong><small>${esc(p.area)} ・ ${esc(p.street||categories[p.cat]?.[0]||'')}</small></div><button data-id="${esc(p.id)}">開く</button></div>`).join('')||'<p class="quiet">該当するピンはありません</p>';document.querySelectorAll('#pinList [data-id]').forEach(b=>b.onclick=()=>{const p=pins.find(p=>p.id===b.dataset.id);map.flyTo([p.lat,p.lng],16);edit(p.id)})}fill();$('pinFilter').oninput=e=>fill(e.target.value)};
$('settings').onclick=()=>{open('設定・データ保存',`<p class="quiet">登録情報はこのブラウザの端末内に保存されます。ブラウザのデータ削除や端末変更に備えて定期的に書き出してください。</p><div class="btnrow"><button class="primary" id="export">JSONを書き出す</button><button class="sub" id="import">JSONを読み込む</button></div><input id="fileInput" type="file" accept=".json,application/json" class="hidden"><div class="btnrow"><button class="sub" id="reset">初期ピンに戻す</button></div><h3>使い方</h3><p class="quiet">1. 目印・通りをタップしてメモを編集。<br>2. 「⊕ ピン追加」または地図の長押しで登録。<br>3. 旧区を表示・非表示に切り替え。<br>4. 検索した場所をピンとして登録可能。<br>5. 物件情報には家賃・設備・内見メモを記録できます。</p><p class="quiet">地図：© OpenStreetMap contributors。境界：GISU/PhuongQuan ArcGIS MapServer（取得時に表示）。検索：OpenStreetMap Nominatim。利用にはネット接続が必要です。初期ピンの位置・営業状況は参考情報です。</p>`);$('export').onclick=()=>{const blob=new Blob([JSON.stringify({app:'Saigon Atlas',version:1,exportedAt:new Date().toISOString(),pins},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='saigon-atlas-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('import').onclick=()=>$('fileInput').click();$('fileInput').onchange=async e=>{try{const obj=JSON.parse(await e.target.files[0].text());if(!Array.isArray(obj.pins)||!obj.pins.every(p=>Number.isFinite(p.lat)&&Number.isFinite(p.lng)&&typeof p.name==='string'))throw Error('形式が異なります');if(confirm(`${obj.pins.length}件のピンで現在のデータを置き換えますか？`)){pins=obj.pins;persist();render();close();toast('取り込みました')}}catch(err){alert('読み込みに失敗しました: '+err.message)}};$('reset').onclick=()=>{if(confirm('保存した編集・追加ピンをすべて初期化しますか？')){localStorage.removeItem('saigon-atlas-v1');location.reload()}}};
async function search(){const q=$('search').value.trim();if(!q)return;const results=$('results');results.style.display='block';results.innerHTML='<div class="result">検索中...</div>';const local=pins.filter(p=>p.name.toLowerCase().includes(q.toLowerCase())||p.street.toLowerCase().includes(q.toLowerCase())).slice(0,5);let remote=[];try{const u='https://nominatim.openstreetmap.org/search?format=json&limit=6&viewbox=106.55,10.94,106.87,10.62&bounded=0&q='+encodeURIComponent(q+' Ho Chi Minh City Vietnam');const response=await fetch(u,{headers:{'Accept-Language':'ja,vi,en'}});if(!response.ok)throw Error();remote=await response.json()}catch(e){}results.innerHTML=[...local.map(p=>`<button class="result" data-local="${esc(p.id)}">📌 ${esc(p.name)}（登録済み）</button>`),...remote.map((r,i)=>`<button class="result" data-remote="${i}">⌕ ${esc(r.display_name)}</button>`)].join('')||'<div class="result">該当なし。地図を直接タップして登録できます。</div>';results.querySelectorAll('[data-local]').forEach(b=>b.onclick=()=>{const p=pins.find(x=>x.id===b.dataset.local);map.flyTo([p.lat,p.lng],17);results.style.display='none';edit(p.id)});results.querySelectorAll('[data-remote]').forEach(b=>b.onclick=()=>{const r=remote[Number(b.dataset.remote)],lat=+r.lat,lng=+r.lon;map.flyTo([lat,lng],17);results.style.display='none';if(confirm('検索した場所に新しいピンを追加しますか？'))create(lat,lng,r.name||r.display_name.split(',')[0])})};$('searchGo').onclick=search;$('search').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();search()}});map.on('movestart',()=>{$('results').style.display='none'});
})();</script></body></html>
